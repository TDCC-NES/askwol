[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "askwol"
version = "0.3.0"
description = "OWL ontology review and validation: class diagram, namespace and term checks, metadata and documentation review"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Kathrin Füllenbach", email = "nes@tdcc.nl" },
    { name = "Dani Metilli", email = "nes@tdcc.nl" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "rdflib>=7.6,<8",
    "httpx>=0.27",
    "click>=8.0",
    "fastapi>=0.115.7",
    "starlette>=0.44.0",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "rich>=13.0",
    "python-multipart>=0.0.9",
    "pyshacl==0.40.0",
    "owlrl>=7.6.2,<8",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.13,<3",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.22",
]

[project.scripts]
askwol = "askwol.cli:main"

[project.urls]
Homepage = "https://lod-4tu.tudelft.nl/askwol"
Repository = "https://github.com/TDCC-NES/askwol"
Issues = "https://github.com/TDCC-NES/askwol/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/askwol"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
filterwarnings = [
    "error",
    # RDFLib 7.6.0 still uses a positional re.sub count and the deprecated
    # Dataset alias internally. Keep these exceptions limited to its callers.
    "ignore:^'count' is passed as positional argument$:DeprecationWarning:rdflib\\.plugins\\.sparql\\.operators$",
    "ignore:^Dataset\\.default_context is deprecated, use Dataset\\.default_graph instead\\.$:DeprecationWarning:rdflib\\.(graph|plugins\\.parsers\\.notation3)$",
]
