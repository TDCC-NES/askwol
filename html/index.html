<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Linked Open Data & Ontology Tools from TDCC-NES & 4TU.ResearchData</title>
	<link rel="canonical" href="https://lod-4tu.tudelft.nl/">
	<meta name="google-site-verification" content="8ypgVD7ncKb5Hl2PpSN6fmK1EbZEmWl_RjSXv0O9FOs">
	<meta name="description" content="Check OWL ontologies with Ask Wol and follow our ontology publishing guide. Free tools and guidance from TDCC-NES and 4TU.ResearchData.">
	<meta property="og:title" content="Linked Open Data & Ontology Tools from TDCC-NES & 4TU.ResearchData">
	<meta property="og:description" content="Check OWL ontologies with Ask Wol and follow our ontology publishing guide. Free tools and guidance from TDCC-NES and 4TU.ResearchData.">
	<meta property="og:url" content="https://lod-4tu.tudelft.nl/">
	<style>
		* {
			box-sizing: border-box;
		}
		body {
			margin: 0;
			padding: 0 1.5rem 4rem;
			font-family: 'Gill Sans', 'Segoe UI', sans-serif;
			font-size: 1.125rem;
			line-height: 1.6;
			color: #24354b;
			background: #fff;
		}
		header,
		main {
			max-width: 64rem;
			margin-inline: auto;
		}
		header {
			padding: 2.5rem 0;
			border-bottom: 1px solid #e3e8ee;
		}
		.partners {
			display: grid;
			grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr);
			align-items: center;
			gap: clamp(1.5rem, 5vw, 4rem);
			max-width: 32rem;
			margin-inline: auto;
		}
		.logo-tdcc,
		.logo-4tu {
			display: block;
		}
		.logo-tdcc img,
		.logo-4tu img {
			width: 100%;
			height: auto;
			display: block;
		}
		a {
			color: #184b7b;
			text-underline-offset: 0.2em;
			text-decoration-thickness: 1px;
		}
		a:hover {
			color: #0b355a;
			text-decoration-thickness: 2px;
		}
		a:focus-visible {
			outline: 3px solid #f09000;
			outline-offset: 5px;
			border-radius: 2px;
		}
		.intro {
			margin: 3.5rem 0 2.5rem;
		}
		h1 {
			max-width: 24ch;
			margin: 0;
			font-size: clamp(2rem, 4vw, 3rem);
			font-weight: 600;
			line-height: 1.2;
			letter-spacing: -0.025em;
		}
		.engineers {
			margin: 1.25rem 0 0;
			font-size: 1.25rem;
		}
		.card {
			display: grid;
			grid-template-columns: auto minmax(0, 1fr);
			align-items: start;
			column-gap: 1.5rem;
			padding: 2rem;
			border: 1px solid #e3e8ee;
			border-radius: 12px;
			background: #f8fafc;
		}
		.card > img {
			grid-row: 1 / span 3;
		}
		.card-title,
		.card-tagline,
		.card-guide {
			grid-column: 2;
		}
		.card-title {
			margin: 0;
			font-size: 1.375rem;
			font-weight: 400;
			line-height: 1.4;
		}
		.card-title a {
			text-decoration: none;
		}
		.card-title a:hover {
			text-decoration: underline;
		}
		.card-tagline {
			max-width: 65ch;
			margin: 0.75rem 0 0;
			color: #526174;
		}
		.card-guide {
			margin: 1.25rem 0 0;
		}
		@media (max-width: 36rem) {
			body {
				padding-inline: 1.25rem;
			}
			header {
				padding-block: 1.75rem;
			}
			.intro {
				margin-block: 2.5rem 2rem;
			}
			.card {
				column-gap: 1rem;
				padding: 1.25rem;
			}
			.card > img {
				grid-row: 1;
				width: 34px;
				height: auto;
			}
			.card-tagline,
			.card-guide {
				grid-column: 1 / -1;
			}
		}
	</style>
</head>
<body>
	<header>
		<div class="partners">
			<a class="logo-tdcc" href="https://tdcc.nl/nes/"><img src="/images/tdcc-nes.webp" alt="TDCC-NES" width="2048" height="1725"></a>
			<a class="logo-4tu" href="https://data.4tu.nl/"><img src="/images/4tu-researchdata.webp" alt="4TU.ResearchData" width="4939" height="1801"></a>
		</div>
	</header>
	<main>
		<div class="intro">
			<h1>Linked Open Data &amp; Ontology Tools</h1>
			<p class="engineers">
				By the <a href="https://tdcc.nl/nes/ontology-engineers/">TDCC-NES Ontology Engineers</a>
			</p>
		</div>
		<section class="card" aria-labelledby="askwol-title">
			<img src="/askwol/static/wollie-h1.png" alt="" width="43" height="56">
			<h2 class="card-title" id="askwol-title">
				<a href="/askwol/">Ask Wol: Online OWL Ontology Checker</a>
			</h2>
			<p class="card-tagline">
				Free, open-source ontology checks and class diagrams.
				Enter a URL or upload an OWL ontology.
			</p>
			<p class="card-guide">
				<a href="/askwol/guide">How to publish an OWL ontology</a>
			</p>
		</section>
	</main>
</body>
</html>
